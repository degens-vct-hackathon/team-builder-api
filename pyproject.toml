[tool.poetry]
name = "team_builder_api"
version = "0.1.0"
description = "VCT LLM + RAG Team Builder Service"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.scripts]
dev = "team_builder_api.scripts:dev"
start = "team_builder_api.scripts:start"
migrate_up = "team_builder_api.scripts:migrate_up"
migrate_down = "team_builder_api.scripts:migrate_down"
migrate_create = "team_builder_api.scripts:migrate_create"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = "^0.30.6"
boto3 = "^1.35.29"
python-dotenv = "^1.0.1"
prisma = "^0.15.0"
alembic = "^1.13.3"
sqlalchemy = "^2.0.36"
psycopg2 = "^2.9.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
